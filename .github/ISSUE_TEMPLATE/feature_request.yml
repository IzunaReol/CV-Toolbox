name: Feature Request / 功能建议
description: 提议一个新功能或改进。 / Suggest a new feature or improvement.
labels: ["enhancement"]
assignees: []
body:
  - type: dropdown
    id: scope
    attributes:
      label: 范围 / Scope
      description: 这个改动主要影响哪一层？ / Which layer does this primarily affect?
      options:
        - Web UI (Streamlit)
        - CLI 脚本 / CLI scripts
        - 文档 / Documentation
        - 工程 / Engineering (CI / build / packaging)
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前痛点 / Current problem
      description: 现在缺少什么 / 不便在哪里？ / What's missing or inconvenient today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议方案 / Proposed solution
      description: 你希望它怎么工作？给个具体的 UX 描述或代码片段更好。 / How should it work? Concrete UX or code snippet is even better.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
      description: 有没有考虑过其他实现？权衡是什么？ / Any alternatives? What are the trade-offs?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 补充上下文 / Additional context
      description: 截图、参考链接、相关 issue 等。 / Screenshots, reference links, related issues.
    validations:
      required: false
