name: Lint

# 轻量 CI：跑 py_compile 和 import 烟测，验证 web/ 与 scripts/ 在多 Python 版本下可解析。
# Lightweight CI: run py_compile + import smoke test across Python versions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: py_compile on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('web/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies (skip torch for speed)
        run: |
          python -m pip install --upgrade pip
          # CI 默认不装 torch（GB 级别且需选 CUDA/CPU index），仅装轻量依赖做语法/导入校验
          pip install "streamlit==1.62.0" "opencv-python>=4.8" "numpy>=1.24" "Pillow>=10.0"

      - name: py_compile all .py
        # 中文路径在 UTF-8 locale 下 git checkout 会保留；显式声明避免 runner 默认 C locale 问题
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          python -m compileall -q web scripts tests
          echo "✓ py_compile OK"

      - name: Import smoke test
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        # 仅校验 web/ 包能否成功 import；不实际跑模型（避免下载权重）。
        run: |
          python -c "import sys; sys.path.insert(0, 'web'); \
                    import helpers, pipeline, task_store, job_manager, artifact_browser; \
                    print('imports OK')"

      - name: Unit tests
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Dependency check
        run: python -m pip check
